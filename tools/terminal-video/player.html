<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0f1a2b;font-family:Inter,"Segoe UI",system-ui,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(900px 520px at 88% 0%,rgba(63,157,253,.38),transparent 70%),linear-gradient(135deg,#0f1a2b 0%,#16345c 100%)}
.badge{position:absolute;top:13px;right:64px;height:30px;line-height:30px;padding:0 14px;border-radius:999px;background:rgba(124,192,255,.16);border:1px solid rgba(124,192,255,.45);color:#cfe6ff;font-size:13px;font-weight:600;letter-spacing:.04em}
.brand{position:absolute;top:13px;left:64px;height:30px;line-height:30px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em}
.brand b{color:#7cc0ff;font-weight:600;letter-spacing:.18em;font-size:12px;margin-left:6px}
.win{position:absolute;left:64px;top:56px;width:1152px;height:612px;background:#0c0c0c;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.tb{height:38px;background:#202020;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#e6e6e6;font-size:14px}
.tb .ctl{letter-spacing:18px;color:#bbb}
.term{position:absolute;left:0;right:0;top:38px;bottom:0;padding:14px 18px;font:16px/1.4 "DejaVu Sans Mono",Consolas,monospace;color:#cccccc;white-space:pre;overflow:hidden}
.cmd{color:#f9f1a5}.par{color:#9aa0a6}.val{color:#cccccc}
.cur{background:#ccc;color:#ccc}
.cap{position:absolute;left:64px;bottom:14px;height:34px;line-height:34px;color:#fff;font-size:16px;font-weight:600}
.cap i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3f9dfd;margin-right:10px;vertical-align:middle}
.dlg{position:absolute;left:420px;top:190px;width:440px;background:#f0f0f0;border:1px solid #6b7a90;box-shadow:0 18px 50px rgba(0,0,0,.55);color:#111;font:14px "Segoe UI",Inter,system-ui,sans-serif}
.dh{background:#fff;padding:9px 12px;border-bottom:1px solid #cfd6df;display:flex;justify-content:space-between;font-size:13px}
.db{padding:16px 18px 16px}
.db .dt{margin-bottom:12px}
.db label{display:block;margin:8px 0 3px;font-size:13px}
.inp{height:26px;line-height:26px;background:#fff;border:1px solid #7a8798;padding:0 8px;font-size:14px;white-space:nowrap;overflow:hidden}
.btns{margin-top:16px;text-align:right}
.btns span{display:inline-block;min-width:78px;text-align:center;padding:5px 0;margin-left:8px;background:#e1e1e1;border:1px solid #adadad;font-size:13px}
.btns span.on{background:#cce4f7;border-color:#2b78c8}
.frm{position:absolute;left:380px;top:170px;width:450px;height:246px;background:#f0f0f0;border:1px solid #6b7a90;box-shadow:0 18px 50px rgba(0,0,0,.55);font:15px "Segoe UI",Inter,system-ui,sans-serif;color:#111}
.frm .dh{padding:10px 12px;font-size:14px}
.fbtn{position:absolute;left:120px;top:96px;width:180px;height:48px;line-height:48px;text-align:center;background:#e1e1e1;border:1px solid #adadad;font-size:17px}
.fbtn.on{background:#cce4f7;border-color:#2b78c8}
.msg{position:absolute;left:470px;top:230px;width:360px;background:#f0f0f0;border:1px solid #6b7a90;box-shadow:0 18px 50px rgba(0,0,0,.6);font:15px "Segoe UI",Inter,system-ui,sans-serif;color:#111}
.msg .dh{height:14px;padding:6px 12px}
.msg .mb{padding:24px 24px 18px}
.msg .btns{background:#e8e8e8;margin:0;padding:12px 16px;text-align:center}
.msg .btns span{margin:0}
.mouse{position:absolute;width:22px;height:30px}
</style></head><body>
<div class="bg"></div>
<div class="brand">RMG<b>LABS</b></div>
<div class="badge" id="badge"></div>
<div class="win"><div class="tb"><span id="ttl"></span><span class="ctl">&#8211;&#9633;&#10005;</span></div><div class="term" id="term"></div></div>
<div class="cap" id="cap"></div>
<div id="over"></div>
<script>
let S,TOTAL=0;
const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hl(t){let first=true;return t.split(/(\s+)/).map(w=>{if(!w)return'';if(/^\s+$/.test(w))return w;let c;if(first){c='cmd';first=false}else if(w[0]==='-')c='par';else c='val';return'<span class="'+c+'">'+esc(w)+'</span>'}).join('')}
function init(s){S=s;let T=0;S.steps.forEach(st=>{st.start=T;st.dur=st.dur||0;T+=st.dur});TOTAL=T;
 document.getElementById('badge').textContent=S.badge;document.getElementById('ttl').textContent=S.title}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function dialog(p,u,pw){const ut=u.slice(0,Math.floor(clamp((p-.12)/.38,0,1)*u.length));const pn=Math.floor(clamp((p-.5)/.22,0,1)*pw);
 return '<div class="dlg"><div class="dh"><span>Windows PowerShell credential request</span><span>&#10005;</span></div><div class="db"><div class="dt">Enter your credentials.</div><label>User name:</label><div class="inp">'+esc(ut)+'</div><label>Password:</label><div class="inp">'+'&#9679;'.repeat(pn)+'</div><div class="btns"><span class="'+(p>.86?'on':'')+'">OK</span><span>Cancel</span></div></div></div>'}
function mouse(x,y){return '<svg class="mouse" style="left:'+x+'px;top:'+y+'px" viewBox="0 0 22 30"><path d="M2 1v22l6-5 4 9 4-2-4-9h8z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>'}
function seek(t){
 const lines=[];let cap='',over='',formOpen=false,formStart=null,showCursor=true;
 for(const s of S.steps){
  if(t<s.start)break;
  const p=s.dur?clamp((t-s.start)/s.dur,0,1):1;const active=t<s.start+s.dur;
  if(s.cap)cap=s.cap;
  if(s.type==='prompt')lines.push(esc(S.prompt));
  else if(s.type==='type'){const n=Math.floor(p*s.text.length+1e-9);lines[lines.length-1]+=hl(s.text.slice(0,n))}
  else if(s.type==='out'){const n=s.dur?Math.floor(p*s.lines.length+1e-9):s.lines.length;for(let i=0;i<n;i++)lines.push(esc(s.lines[i]))}
  else if(s.type==='dialog'&&active){over+=dialog(p,s.user,s.pw);showCursor=false}
  else if(s.type==='form'){formOpen=true;formStart=s;}
  else if(s.type==='msgbox'){formOpen=true;formStart=null;if(active){over+='<div class="msg"><div class="dh"></div><div class="mb">'+esc(s.text)+'</div><div class="btns"><span class="'+(p>.8?'on':'')+'">OK</span></div></div>'}else formOpen=false}
  else if(s.type==='formclose')formOpen=false;
 }
 // form window (under dialogs/messageboxes)
 let formHtml='';
 if(formOpen){const fs=S.steps.find(x=>x.type==='form');const p=clamp((t-fs.start)/fs.dur,0,1);const pressed=p>.72&&p<.9;
  formHtml='<div class="frm"><div class="dh"><span>'+esc(fs.title)+'</span><span>&#10005;</span></div><div class="fbtn '+(pressed?'on':'')+'">'+esc(fs.button)+'</div></div>';
  if(t<fs.start+fs.dur){const mp=clamp((p-.1)/.55,0,1);const e=mp*mp*(3-2*mp);formHtml+=mouse(lerp(900,600,e),lerp(520,300,e))}
  showCursor=false}
 const blink=Math.floor(t/530)%2===0;
 const term=document.getElementById('term');
 term.innerHTML=lines.join('\n')+(showCursor&&blink?'<span class="cur">_</span>':'');
 term.scrollTop=term.scrollHeight;
 document.getElementById('cap').innerHTML=cap?'<i></i>'+esc(cap):'';
 document.getElementById('over').innerHTML=formHtml+over;
}
</script></body></html>
